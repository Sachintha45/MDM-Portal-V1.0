---
_schema-version: "3.1"
ID: mdm-portal
version: 1.0.0
description: "MDM Portal — SAP CAP Application"

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        # Fix start command — use cds-serve (available in @sap/cds runtime)
        - node -e "const fs=require('fs');let p=JSON.parse(fs.readFileSync('gen/srv/package.json','utf8'));delete p.main;p.scripts.start='cds-serve';fs.writeFileSync('gen/srv/package.json',JSON.stringify(p,null,2))"
        # Remove server.js — cds-serve handles bootstrapping
        - rm -f gen/srv/srv/server.js
        # Pre-copy UI5 webapp into approuter
        - node -e "const fs=require('fs'),p=require('path');function cp(src,dst){const st=fs.statSync(src);if(st.isDirectory()){fs.mkdirSync(dst,{recursive:true});fs.readdirSync(src).forEach(f=>cp(p.join(src,f),p.join(dst,f)))}else{fs.copyFileSync(src,dst)}};cp('app/webapp','app/router/webapp');cp('app/router/index.html','app/router/webapp/index.html')"

modules:
  # ── CAP Service Module ────────────────────────────────────────────
  - name: mdm-portal-srv
    type: nodejs
    path: gen/srv
    properties:
      EXIT: 1
    requires:
      - name: mdm-portal-uaa
      - name: mdm-portal-destination
      - name: mdm-portal-connectivity
      - name: mdm-portal-db
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  # ── HANA DB Deployer (schema + seed data) ──────────────────────────
  - name: mdm-portal-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: mdm-portal-db

  # ── App Router (serves UI5 frontend) ───────────────────────────────
  - name: mdm-portal-approuter
    type: approuter.nodejs
    path: app/router
    build-parameters:
      builder: custom
      commands:
        - npm install
    requires:
      - name: mdm-portal-uaa
      - name: srv-api
        group: destinations
        properties:
          forwardAuthToken: true
          name: srv-api
          url: ~{srv-url}

resources:
  # ── XSUAA (Authentication & Authorization) ─────────────────────────
  - name: mdm-portal-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      service-name: mdm-portal-uaa

  # ── Destination service — references the EXISTING "desination"
  # instance already in this space (yes, that's a typo in the real CF
  # instance name — service-name below has to match it exactly, since
  # this points at what's already there rather than creating a new one).
  # Without this, mdm-portal-srv has nothing to resolve MDM_Workflow_Dest
  # with once deployed — see _triggerApprovalWorkflow in mdm-service.js.
  - name: mdm-portal-destination
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: desination

  # ── Connectivity service — routes calls to on-premise destinations
  # (ProxyType OnPremise) through the Cloud Connector. Needed for
  # the S4H_HTTP destination, which srv/integration-service.js uses to
  # create Business Partners in S/4HANA. Without this binding, a call to
  # an on-premise destination fails even when the destination itself and
  # the Cloud Connector are set up correctly.
  - name: mdm-portal-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
      service-name: mdm-portal-connectivity

  # ── HANA HDI container (hdi-shared) — existing instance ────────────
  - name: mdm-portal-db
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: mdm-portal-db
